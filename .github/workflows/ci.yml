name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ci-not-used
      DOCMIND_ACCESS_KEY_ID: ci-not-used
      DOCMIND_ACCESS_KEY_SECRET: ci-not-used
      ROOT_PATH: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app run.py run_production.py gunicorn.conf.py

      - name: Check production dependencies
        run: python run_production.py --check

      - name: Run tests
        run: python -m pytest

